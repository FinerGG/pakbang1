<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานปัญหา | สภานักเรียน</title>
    <link rel="stylesheet" href="style.css">

<body>

    <div class="container">
        <h1>รายงานปัญหาถึงสภานักเรียน</h1>
        <p>กรุณากรอกรายละเอียดปัญหาที่พบ</p>
        <form id="problemForm">
        <label for="problemDescription">รายละเอียดปัญหา:</label>
        <textarea id="problemDescription" name="problemDescription" rows="6" required></textarea>

        <label for="problemImage">แนบรูปภาพ (ไม่บังคับ, สูงสุด 8MB):</label>
            <input type="file" id="problemImage" name="problemImage" accept="image/*">
            <button type="submit">ส่งรายงาน</button>
        </form>
        <div id="responseMessage"></div>
